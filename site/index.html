<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>artifact学会。 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div id="hint"></div>
  <div id="cross"><i></i><i></i></div>
  <div id="charge" hidden><i></i></div>
  <div id="left">
    <div id="topleft">
      <div id="selfview"><div id="pose"></div></div>
      <div id="minimap">
        <svg id="compass" viewBox="0 0 40 40" width="40" height="40"><circle cx="20" cy="20" r="18" fill="rgba(0,0,0,.38)" stroke="rgba(255,255,255,.7)"/><g transform="rotate(33 20 20)"><path d="M20 6 L25 21 L15 21 Z" fill="#ff5a4a"/><path d="M20 34 L25 21 L15 21 Z" fill="#e8e8e8"/></g><text x="20" y="40" text-anchor="middle" font-size="0"></text></svg>
      </div>
    </div>
    <div id="debug" hidden></div>
  </div>
  <div id="right">
    <div id="online"></div>
    <div id="feed"></div>
  </div>
  <div id="mode" hidden></div>
  <div id="update" hidden></div>
  <div id="resume" hidden>クリックで操作を再開</div>
  <div id="bottom">
    <div id="itemname"></div>
    <div id="hearts"></div>
    <div id="hotbar"></div>
  </div>
</div>

<div id="shade" hidden></div>
<div id="panel-login" class="panel wide" hidden></div>
<div id="panel-menu" class="panel wide" hidden></div>
<div id="panel-inventory" class="panel" hidden></div>
<div id="panel-book" class="panel" hidden></div>

<div id="fatal" hidden>3Dの部品(three.js)を読み込めませんでした。ネットワークを確認して、再読み込みしてください。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
